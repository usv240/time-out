name: CI

on:
  push:
  pull_request:
  schedule:
    # The deployed site depends on live third parties. A daily run means a silent
    # breakage is found by us rather than by a judge.
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Offline Gate demo (no network, no credentials)
        run: python -m before.gate_demo
      - name: Offline hero-path verification
        run: python -m before.verify

  smoke:
    # Drives the deployed UI against the deployed backend in a real browser.
    # The unit suite cannot see a transport-layer rejection between the two:
    # the two most important attacks on /try once returned HTTP 400 instead of a
    # refusal while every unit test passed. This is the test that catches that.
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Smoke test the deployed site
        run: python -m tests.smoke_live
