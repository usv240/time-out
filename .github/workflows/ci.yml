name: CI

on:
  push:
  pull_request:

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic Gate tests
        run: python -m unittest discover -s tests -v
      - name: Run offline synthetic demo
        run: python -m before.gate_demo

