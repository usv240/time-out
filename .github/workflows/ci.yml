name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite (55 checks)
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Offline Gate demo (no network, no credentials)
        run: python -m before.gate_demo
      - name: Offline hero-path verification
        run: python -m before.verify
